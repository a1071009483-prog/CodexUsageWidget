name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore CodexUsageWidget.sln

      - name: Core tests
        timeout-minutes: 3
        shell: pwsh
        run: dotnet test tests/CodexUsageWidget.Core.Tests/CodexUsageWidget.Core.Tests.csproj -c Release --no-restore --blame-hang --blame-hang-timeout 60s

      - name: Infrastructure tests
        timeout-minutes: 5
        shell: pwsh
        run: dotnet test tests/CodexUsageWidget.Infrastructure.Tests/CodexUsageWidget.Infrastructure.Tests.csproj -c Release --no-restore --blame-hang --blame-hang-timeout 60s

      - name: App tests
        timeout-minutes: 3
        shell: pwsh
        run: dotnet test tests/CodexUsageWidget.App.Tests/CodexUsageWidget.App.Tests.csproj -c Release --no-restore --blame-hang --blame-hang-timeout 60s

      - name: Acceptance tests
        timeout-minutes: 3
        shell: pwsh
        run: dotnet test tests/CodexUsageWidget.AcceptanceTests/CodexUsageWidget.AcceptanceTests.csproj -c Release --no-restore --blame-hang --blame-hang-timeout 60s

      - name: Package portable artifact
        shell: pwsh
        run: .\scripts\package.ps1 -Configuration Release -RuntimeIdentifier win-x64 -Version 0.0.0-ci -Clean

      - name: Verify portable artifact
        shell: pwsh
        run: .\scripts\verify-release.ps1 -Version 0.0.0-ci -RuntimeIdentifier win-x64
